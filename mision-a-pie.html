function intro(){app.innerHTML='<div class="language-bar"><button id="langToggle" class="go lang-switch" onclick="toggleGameLanguage()">English</button></div><h1>Base Luna: misión a pie</h1><button class="go" onclick="toggleMusic()">🎵 Música: <span id="musicLabel">OFF</span></button><p class="mut">Banda sonora ambiental original, generada por el navegador.</p><p>Eres un astronauta explorando la Luna durante 7 días. Camina, recoge recursos y vuelve a la base antes de que se acabe el tiempo. El terreno se genera sin fin hacia la izquierda y la derecha: puedes explorar más allá del horizonte y regresar.</p><p class="mut">🎁 Recompensa pasiva: recibes 1 punto de habilidad por cada día natural que visites el juego. Se guarda aunque cierres la página. También puedes ganar puntos de investigación llevando muestras científicas (S) a la base.</p><div class="card"><p><b>O₂:</b> aire para respirar. <b>Energía:</b> la electricidad. <b>Escudo:</b> protege de la <b>radiación</b>, una energía invisible del Sol que enferma a los astronautas. <b>Salud:</b> tu cuerpo.</p><p>Tu mochila comienza con <b>3 espacios</b>; puedes ampliarla hasta <b>8</b> con una mejora independiente del árbol de habilidades. El mapa es infinito en ambos sentidos y cada zona genera terreno, obstáculos y recursos nuevos. Lo que está más lejos vale más, pero afuera recibes más radiación y el tiempo corre. Algunas jornadas pueden terminar con una <b>lluvia de meteoritos</b>: busca refugio en la base. En el resumen diario instala paneles solares para generar energía y construye módulos para ampliar el refugio.</p><p><b>Obstáculos:</b> salta ⬆ rocas y cráteres (la gravedad cambia según el entorno: en la Luna es menor (1.62 m/s²) y en Marte mayor (3.71 m/s²), así que el salto y el tiempo en el aire son distintos.). Las colisiones usan cajas separadas para el cuerpo, rocas y bordes de cráter: si se superponen, pierdes salud y 2 segundos. <b>Cultivos:</b> frente a la base pulsa <b>Q</b> para sembrar 🌱, regar 💧 con el hielo de agua que traigas y cosecha 🍅 cuando madure. Si no la cosechas al día siguiente, se echa a perder.</p></div><p><b>Elige tu destino:</b></p><button class="go" onclick="start(false)">🌙 Luna</button><button class="go" onclick="start(true)">🔴 Marte (aviso tarde, poco sol)</button><details class="card"><summary><b>La ciencia real de este juego</b></summary><p><b>DONKI</b> (clima espacial de la NASA): las fechas y clases de las tormentas solares son eventos reales.</p><p><b>OSDR</b> (datos biológicos de la NASA): los datos curiosos sobre huesos, músculos y radiación en astronautas.</p><p><b>Artemis, Chang’e 4 y Curiosity</b>: la noche lunar y la radiación en la Luna y en Marte. En Marte llega cerca de 43% de la luz solar de la Tierra, por eso la energía vale menos.</p><p><b>Honestidad:</b> en la vida real, con escudos, una tormenta no enferma a los astronautas al instante: el riesgo grande se acumula con meses y años (más riesgo de cáncer y cataratas). El juego lo acelera para que se vea. Los eventos históricos de ejemplo están guardados dentro del juego; el panel de datos NASA permite consultar DONKI en vivo cuando hay conexión. Las barras y la dosis son una simplificación.</p></details><details class="card"><summary><b>Para familias y escuelas</b></summary><p>Preguntas: ¿qué recogiste primero y por qué? ¿Qué pasó cuando te quedaste lejos de la base en una tormenta? ¿Por qué la NASA mira el clima espacial antes de una caminata? Jueguen en Marte y comparen.</p></details><div class="card"><b>Recursos científicos NASA y agencias asociadas</b><p class="src">DONKI: <a href="https://ccmc.gsfc.nasa.gov/tools/DONKI/" target="_blank" rel="noopener">clima espacial</a> · OSDR: <a href="https://osdr.nasa.gov/bio/repo/" target="_blank" rel="noopener">biología espacial</a> · RadLab: <a href="https://visualization.osdr.nasa.gov/radlab/gui/data-api/" target="_blank" rel="noopener">dosimetría</a> · Mars Trek: <a href="https://trek.nasa.gov/mars/" target="_blank" rel="noopener">terreno marciano</a> · <a href="https://api.nasa.gov/" target="_blank" rel="noopener">NASA Open APIs</a>.</p><p class="src">CSA: <a href="https://www.asc-csa.gc.ca/eng/youth-educators/resources-stem-and-youth-organizations.asp" target="_blank" rel="noopener">recursos STEM</a> · <a href="https://www.asc-csa.gc.ca/eng/youth-educators/toolkits/food-production/" target="_blank" rel="noopener">producción de alimentos</a>. Los eventos del juego son históricos y están guardados; no son datos en vivo.</p></div><p class="src">Gravedad aproximada: Luna 1.62 m/s²; Marte 3.71 m/s². La física está escalada para el juego.</p>'}
var DAILY_KEY="baseLuna_dailyPoints_v1";
function claimDailyPoint(){var data={date:"",bank:0};try{data=JSON.parse(localStorage.getItem(DAILY_KEY)||"{}")}catch(e){}if(!data||typeof data!=="object")data={};data.bank=Math.max(0,Math.floor(Number(data.bank)||0));var now=new Date(),today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"),earned=false;if(data.date!==today){data.bank++;data.date=today;earned=true;try{localStorage.setItem(DAILY_KEY,JSON.stringify(data))}catch(e){}}return {bank:data.bank,earned:earned}}
function start(m){if(m===undefined)m=g?g.mars:false;var daily=claimDailyPoint();var ds=[2,3,4,5,6,7].sort(function(){return Math.random()-.5}).slice(0,3),st={},pool=STORMS.slice().sort(function(){return Math.random()-.5});
 ds.forEach(function(d,i){st[d]=pool[i]});g={day:1,o:60,e:60,p:60,h:100,sci:0,skillPts:daily.bank,skills:{speed:0,jump:0,warning:0,radiation:0},capacity:3,storageLevel:0,solarLevel:0,shelterLevel:0,st:st,mars:!!m,gravity:m?3.71:1.62,dose:0,dz:0,fl:false,agua:1,pl:[{x:30,s:0,w:0},{x:50,s:0,w:0},{x:70,s:0,w:0}]};
 app.innerHTML='<div class="language-bar"><button id="langToggle" class="go lang-switch" onclick="toggleGameLanguage()">English</button></div><div id="top" class="mut"></div><button class="go" onclick="toggleMusic()">🎵 Música: <span id="musicLabel">OFF</span></button><details class="menu-research"><summary>☰ Menú · Investigación: <b id="researchPoints">0</b> pts</summary><p>Los puntos de investigación se obtienen al entregar muestras científicas y completar la recompensa diaria. Se usan para mejorar el equipo y la base.</p><p class="mut">Controles: ←/A y →/D mover · Espacio/↑ saltar · Q sembrar/regar/cosechar · G reiniciar misión · Enter siguiente día.</p><button class="go" onclick="start(g.mars)">↻ Reiniciar misión (G)</button></details><div class="hud" id="hud"></div><div id="al" class="mut"></div><canvas id="cv" width="960" height="704" aria-label="Juego HD 4x: explora un mundo infinito en ambos sentidos"></canvas><div class="pad"><button id="bl" aria-label="Izquierda">◀</button><button id="br" aria-label="Derecha">▶</button><button id="bj" aria-label="Saltar">⬆</button><button id="bx" aria-label="Acción Q">Q · 🌱</button></div><div id="ctl"></div>';
 ctx=$("cv").getContext("2d");ctx.setTransform(4,0,0,4,0,0);ST=[];for(var i=0;i<60;i++)ST.push({x:Math.random()*240,y:Math.random()*100,c:Math.random()<.2?"#ffb38a":"#fff"});CR=[];for(i=0;i<9;i++)CR.push({x:80+i*80+Math.random()*30,w:14+Math.random()*16});
 [["bl","l"],["br","r"]].forEach(function(p){var b=$(p[0]);b.addEventListener("pointerdown",function(e){e.preventDefault();keys[p[1]]=1;snd(200,.05)});["pointerup","pointerleave","pointercancel"].forEach(function(ev){b.addEventListener(ev,function(){keys[p[1]]=0})})});$("bj").addEventListener("pointerdown",function(e){e.preventDefault();jump()});$("bx").addEventListener("pointerdown",function(e){e.preventDefault();act()});
 newDay();if(daily.earned){$("al").innerHTML='<div class="card">🎁 ¡Punto de investigación diario conseguido! +1 punto. Saldo diario guardado: '+daily.bank+'.</div>'+$("al").innerHTML}}
function newDay(){var d=g.day,ty=["O","E","P","A","S"],al="";if(g.day>1&&g.solarLevel){var gain=g.solarLevel*(g.mars?4:8);g.e=cl(g.e+gain);g.lastSolar=gain}else{g.lastSolar=0}g.t=DAY+(g.st[d]?g.skills.warning*4:0);g.ph="play";g.cinema=(g.day===1?10.5:0);g.cinemaTotal=10.5;g.px=60;g.f=1;g.wk=0;g.carry=[];g.dz=0;g.expo=0;g.dep=[];g.items=[];g.ob=[];g.py=0;g.vy=0;g.hit=0;g.fl=false;g.meteorDay=Math.random()<.24;g.mets=[];pt=[];pops=[];
 // Mundo procedural infinito: cada tramo se genera una sola vez y se conserva al regresar.
 g.ob=[];g.items=[];g.generated={};g.chunkSize=360;
 for(var cx=-1;cx<=2;cx++)generateChunk(cx);
 (g.mars?[d]:[d,d+1]).forEach(function(x){var s=g.st[x];if(s){al+='<div class="card alert">⚠️ <b>Alerta de DONKI'+(g.mars?' (llegó tarde: en Marte los mensajes tardan de 3 a 22 minutos)':'')+':</b> '+(x==d?'hoy, al acabar el tiempo,':'mañana')+' llega una '+s.n+' (evento real del '+s.f+'). '+scale(s)+' Los rayos caen fuera de la base: ¡vuelve antes!</div>'}});
 if(g.meteorDay)al+='<div class="card alert">☄️ <b>Pronóstico:</b> hay posibilidad de lluvia de meteoritos al terminar la jornada. Si ocurre, vuelve a la base para refugiarte.</div>';$("al").innerHTML=al;$("ctl").innerHTML="";tp();hud();last=performance.now();if(!newDay.on){newDay.on=1;requestAnimationFrame(loop)}}
function chunkRand(seed){var x=Math.sin(seed*127.1+g.day*311.7+(g.mars?91:17))*43758.5453;return x-Math.floor(x)}
function generateChunk(cx){
 if(g.generated[cx])return;g.generated[cx]=1;
 var left=cx*g.chunkSize,right=left+g.chunkSize,seed=(cx+100000)*19+g.day*37;
 var safe=right>0&&left<112;
 for(var i=0;i<5;i++){
  var r=chunkRand(seed+i*7),x=left+28+r*(g.chunkSize-56);
  if(safe&&x<125)continue;
  var cr=chunkRand(seed+i*13+5)<.34,w=cr?18+chunkRand(seed+i*17)*10:9+chunkRand(seed+i*19)*5;
  g.ob.push({x:x,c:cr,w:w,chunk:cx});

 for(i=0;i<7;i++){
  var rr=chunkRand(seed+300+i*11),x2=left+35+rr*(g.chunkSize-70);

  if(type=="E"&&g.mars)value=Math.round(value*.6);

 }
}
function ensureWorld(){
 var center=Math.floor(g.px/g.chunkSize);

}
function dep(){g.carry.forEach(function(it){var k={O:"o",E:"e",P:"p",A:"agua",S:"sci"}[it.t];g[k]=(k=="sci"||k=="agua")?g[k]+it.v:cl(g[k]+it.v);if(it.t=="S")g.skillPts+=Math.max(1,Math.floor(it.v/5));g.dep.push(TY[it.t][1]+" +"+it.v);pops.push({x:60,y:GY-40,t:"+"+it.v,c:TY[it.t][0],l:1})});g.carry=[];snd(660,.15,"triangle");hud();tp()}
function loop(now){requestAnimationFrame(loop);var dt=Math.min((now-last)/1000,.05);last=now;if(!g||!ctx)return;upd(dt);draw();hT+=dt;if(hT>.25){hT=0;if(g.ph!="sum"){hud();lab()}}}
function boxHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function playerBoxes(){var top=GY-g.py-24;return [{x:g.px-4,y:top+1,w:8,h:7},{x:g.px-5,y:top+8,w:10,h:8},{x:g.px-4,y:top+16,w:8,h:7}]}

function gameTranslate(value){var s=String(value);if(gameLanguage!=="en")return s;if(Object.prototype.hasOwnProperty.call(GAME_TRANSLATIONS,s))return GAME_TRANSLATIONS[s];if(/llamarada solar clase [A-Z][0-9]+(?:\\.[0-9]+)?/.test(s))s=s.replace(/llamarada solar clase ([A-Z][0-9]+(?:\\.[0-9]+)?)/g,"$1-class solar flare");Object.keys(GAME_TRANSLATIONS).sort(function(a,b){return b.length-a.length}).forEach(function(k){if(k.length>2&&s.indexOf(k)>=0)s=s.split(k).join(GAME_TRANSLATIONS[k])});return s}
function gameLocalizeNode(n){if(!n||n.nodeType!==3||!n.parentElement||n.parentElement.closest("#langToggle"))return;var cur=n.data;if(!gameTextOriginals.has(n))gameTextOriginals.set(n,cur);else if(gameTextRendered.has(n)&&cur!==gameTextRendered.get(n))gameTextOriginals.set(n,cur);var orig=gameTextOriginals.get(n),next=gameLanguage==="en"?gameTranslate(orig):orig;if(cur!==next)n.data=next;gameTextRendered.set(n,next)}
function gameLocalizeAttr(el,a){var v=el.getAttribute(a);if(!v)return;var orig=gameAttrOriginals.get(el)||{},rendered=gameAttrRendered.get(el)||{};if(!(a in orig))orig[a]=v;else if(a in rendered&&v!==rendered[a])orig[a]=v;var next=gameLanguage==="en"?gameTranslate(orig[a]):orig[a];if(v!==next)el.setAttribute(a,next);gameAttrOriginals.set(el,orig);rendered[a]=next;gameAttrRendered.set(el,rendered)}
function gameLocalize(root){if(!root)return;if(root.nodeType===3){gameLocalizeNode(root);return}var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n;while((n=w.nextNode()))gameLocalizeNode(n);if(root.querySelectorAll)root.querySelectorAll("[aria-label],[title]").forEach(function(el){gameLocalizeAttr(el,"aria-label");gameLocalizeAttr(el,"title")})}
function toggleGameLanguage(){gameLanguage=gameLanguage==="es"?"en":"es";try{localStorage.setItem("baseLuna_language",gameLanguage)}catch(e){}gameLocalize(app);var b=document.getElementById("langToggle");if(b)b.textContent=gameLanguage==="es"?"English":"Español";document.documentElement.lang=gameLanguage}

var gameLanguageObserver=new MutationObserver(function(records){records.forEach(function(r){if(r.type==="characterData")gameLocalizeNode(r.target);else Array.prototype.forEach.call(r.addedNodes,function(n){gameLocalize(n)})})});gameLanguageObserver.observe(app,{childList:true,subtree:true,characterData:true});
